<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="Gps4.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EduGps4</title>
    <style>
        :root {
            --bg-dark: #050b05;
            --card-bg: #0c180c;
            --card-hover: #142814;
            --accent: #00ff66;         /* Verde neon principal */
            --accent-dim: #00b347;     /* Verde secundário */
            --accent-bright: #00ff88;  /* Verde de destaque */
            --text-main: #e6ffe6;
            --text-muted: #80c080;
            --border: #1a3d1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        html, body { min-height: 100%; height: 100%; }
        
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 15% 20%, rgba(0, 255, 102, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0, 179, 71, 0.08) 0%, transparent 45%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        a { color: inherit; text-decoration: none; }

        .app { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            max-width: 1220px; 
            height: 100vh; 
            padding: 24px; 
        }

        /* HEADER GLOBAL SUPERIOR */
        header {
            background: #081208;
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border-radius: 12px;
            width: 100%;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* LOGO Gps4.png COM BRILHO NEON VERDE */
        .gps4-logo {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
            background-color: #000;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.25rem;
            background: linear-gradient(45deg, var(--accent), #00b347);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .brand-sub {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .bar-ready {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bar-ready::before {
            content: "";
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        /* CONTAINER CENTRALIZADO */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .hero-title { 
            font-size: clamp(32px, 5vw, 48px); 
            font-weight: 800; 
            letter-spacing: -.03em; 
            line-height: 1.1; 
            margin-bottom: 8px; 
            color: #fff; 
        }

        .hero-title em { 
            color: var(--accent); 
            font-style: normal; 
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.5); 
        }

        .sub { 
            color: var(--text-muted); 
            font-size: 1.1rem; 
            margin-bottom: 28px; 
            max-width: 500px; 
        }

        /* CARD CENTRALIZADO 13.52 */
        .single-host-card {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 20px;
            padding: 30px 40px;
            width: min(100%, 480px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.25);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .single-host-card:hover, .single-host-card:focus {
            background: var(--card-hover);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 45px rgba(0, 255, 102, 0.45);
            outline: none;
        }

        .fw-badge {
            background: rgba(0, 255, 102, 0.15);
            color: var(--accent-bright);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .fw-version {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .fw-meta {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .btn-launch {
            margin-top: 10px;
            background: linear-gradient(45deg, var(--accent), var(--accent-dim));
            color: #000;
            font-weight: 800;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
            transition: all 0.2s ease;
        }

        .single-host-card:hover .btn-launch {
            background: #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.7);
        }

        /* RODAPÉ NOSSO DA EDUGps4 */
        .foot {
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 13px;
            padding: 16px 4px 4px;
            text-align: center;
            width: 100%;
        }
        .foot b { color: var(--accent); }

        @media (max-width: 760px) {
            header { padding: 12px 16px; }
            .app { padding: 16px 12px; }
            .hero-title { font-size: 32px; }
            .single-host-card { padding: 24px 20px; }
            .fw-version { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- HEADER GLOBAL -->
        <header>
            <div class="brand-header">
                <img src="Gps4.png" alt="Logo EduGps4" class="gps4-logo">
                <div>
                    <h1>EduGps4</h1>
                    <div class="brand-sub">Eduxds2 · PS4 Host · FW 13.52</div>
                </div>
            </div>
            <span class="bar-ready">SISTEMA PRONTO</span>
        </header>

        <!-- CONTEÚDO CENTRALIZADO -->
        <main class="main-container">
            <h2 class="hero-title">Iniciar <em>Desbloqueio</em></h2>
            <p class="sub">Host dedicado otimizado para o seu PlayStation 4</p>

            <a class="single-host-card" href="1352/index.html" id="mainHostBtn">
                <span class="fw-badge">GoldHEN Offline</span>
                <span class="fw-version">FW 13.52</span>
                <span class="fw-meta">Eduxds2 Host // Eduxds2 Exploit</span>
                <span class="btn-launch">Acessar Host</span>
            </a>
        </main>

        <!-- RODAPÉ PERSONALIZADO -->
        <footer class="foot">
            <div><b>EduGps4</b> // Sistema de Desbloqueio PS4 · <b>Eduxds2</b></div>
        </footer>
    </div>

    <script>
        (function () {
            var btn = document.getElementById('mainHostBtn');
            if (btn) btn.focus();
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGps4 // 13.02-13.52 GOLDHEN · Eduxds2</title>
<link rel="icon" type="image/png" href="Gps4.png">
<style>
    :root {
        --bg-dark: #090d16;
        --card-bg: #131c2e;
        --card-hover: #1c2a45;
        --accent: #00d2ff;
        --accent-purple: #9d4edd;
        --accent-pink: #ff007f;
        --text-main: #ffffff;
        --text-muted: #a0aec0;
        --success: #00e676;
        --danger: #ff1744;
        --warning: #facc15;
        --border: #2d3748;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    html { background: var(--bg-dark); }
    html, body { min-height: 100%; }
    
    body {
        background-color: var(--bg-dark);
        background-image: 
            radial-gradient(circle at 15% 20%, rgba(157, 78, 221, 0.12) 0%, transparent 45%),
            radial-gradient(circle at 85% 80%, rgba(0, 210, 255, 0.1) 0%, transparent 45%);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* HEADER GLOBAL SUPERIOR ESTILO EDUXDS2 */
    header {
        background: #0b111e;
        border-bottom: 1px solid var(--border);
        padding: 16px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .brand-header {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .gps4-logo {
        width: 44px;
        height: 44px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.7));
        flex-shrink: 0;
    }

    header h1 {
        font-size: 1.25rem;
        background: linear-gradient(45deg, var(--accent), var(--accent-pink));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 800;
    }

    .brand-sub {
        font-size: 0.75rem;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .badge-chain {
        background: rgba(0, 210, 255, 0.1);
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .badge-chain::before {
        content: "";
        width: 8px;
        height: 8px;
        background-color: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent);
    }

    /* CONTAINER PRINCIPAL */
    .app {
        margin: 0 auto;
        padding: 30px 24px;
        width: min(100% - 48px, 1100px);
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    /* STATUS DO EXPLOIT */
    #state {
        color: var(--accent);
        font-size: 1.5rem;
        font-weight: 800;
        line-height: 1.3;
        margin-bottom: 16px;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .ok { color: var(--success) !important; }
    .bad { color: var(--danger) !important; }
    .warn { color: var(--warning) !important; }

    /* CONSOLE DE SAÍDA DO EXPLOIT */
    #out {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--text-main);
        font-family: 'Consolas', 'Liberation Mono', monospace;
        font-size: 13.5px;
        line-height: 1.6;
        height: calc(100vh - 210px);
        overflow-y: auto;
        padding: 20px;
        white-space: pre-wrap;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        position: relative;
    }

    /* BARRA DE ROLAGEM ESTILIZADA */
    #out::-webkit-scrollbar {
        width: 8px;
    }
    #out::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.2);
        border-radius: 8px;
    }
    #out::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
    }
    #out::-webkit-scrollbar-thumb:hover {
        background: var(--accent-purple);
    }

    @media (max-width: 760px) {
        header { padding: 12px 16px; }
        .badge-chain { font-size: 0.7rem; padding: 4px 10px; }
        .app { padding: 16px 12px; width: 100%; }
        #state { font-size: 1.2rem; margin-bottom: 12px; }
        #out { height: calc(100vh - 170px); font-size: 12px; padding: 14px; }
    }
</style>
</head>
<body>

    <!-- HEADER GLOBAL PADRÃO EDUXDS2 -->
    <header>
        <div class="brand-header">
            <img src="Gps4.png" alt="Logo EduGps4" class="gps4-logo">
            <div>
                <h1>⚡ EduGps4 · GoldHEN</h1>
                <div class="brand-sub">Eduxds2 · Host PS4 · FW 13.02-13.52</div>
            </div>
        </div>

        <div class="badge-chain">cadeia slopkit</div>
    </header>

    <div class="app">
        <div id="state">Carregando desbloqueio...</div>
        <div id="out"></div>
    </div>

<script type="module">import "./jb.js";</script>
<script>
// Auto-recarregamento controlado quando a primitiva desiste.
(function () {
    var KEY = "edugps4-1352-reloads";
    var MAX = 2;
    var WINDOW_MS = 10 * 60 * 1000;
    var handled = false;
    function readBudget() {
        var rec = null;
        try { rec = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) { rec = null; }
        var now = Date.now();
        if (!rec || typeof rec.n !== "number" || (now - rec.t) > WINDOW_MS) return { n: 0, t: now };
        return rec;
    }
    function spendBudget() {
        var rec = readBudget();
        rec.n++;
        rec.t = Date.now();
        try {
            sessionStorage.setItem(KEY, JSON.stringify(rec));
            var check = JSON.parse(sessionStorage.getItem(KEY) || "null");
            if (check && check.n === rec.n) return rec;
        } catch (e) {}
        return null;
    }
    function successSeen(txt) {
        var lines = txt.split("\n");
        for (var i = lines.length - 1; i >= 0; i--) {
            if (lines[i].indexOf("PAYLOAD-RUNNING") !== -1) {
                return lines[i].indexOf("PROOF-OK") === 0;
            }
        }
        return false;
    }
    setInterval(function () {
        try {
            if (handled) return;
            var st = document.getElementById("state");
            var out = document.getElementById("out");
            var txt = out ? out.textContent : "";
            if (successSeen(txt)) {
                try { sessionStorage.removeItem(KEY); } catch (e) {}
                handled = true;
                return;
            }
            if (!st || st.textContent !== "threw") return;
            if (txt.indexOf("attempt-ceiling") === -1) return;
            handled = true;
            var rec = spendBudget();
            if (!rec || rec.n > MAX) return;
            st.textContent = "Layout do heap falhou -- recarregando para tentar novamente (" + rec.n + "/2)...";
            st.className = "warn";
            setTimeout(function () { location.reload(); }, 2000);
        } catch (e) { /* nunca interromper a página do exploit */ }
    }, 3000);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGps4 </title>
<link rel="icon" type="image/png" href="./Gps4.png">
<style>
    :root {
        --bg-dark: #050b05;
        --card-bg: #0c180c;
        --accent: #00ff66;         /* Verde neon principal */
        --accent-bright: #00ff88;  /* Verde de destaque */
        --text-main: #e6ffe6;
        --text-muted: #80c080;
        --border: #1a3d1a;
        --red: #ff4d4d;
        --amber: #ffcc00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    html, body { min-height: 100%; height: 100%; }

    body {
        background-color: var(--bg-dark);
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.12) 0%, transparent 60%),
            radial-gradient(circle at 15% 20%, rgba(0, 255, 102, 0.08) 0%, transparent 45%);
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
    }

    .app { 
        display: flex; 
        flex-direction: column; 
        width: 100%; 
        max-width: 1220px; 
        height: 100vh; 
        padding: 24px; 
    }

    /* HEADER GLOBAL SUPERIOR */
    header {
        background: #081208;
        border-bottom: 1px solid var(--border);
        padding: 16px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        border-radius: 12px;
        width: 100%;
    }

    .brand-header {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .gps4-logo {
        width: 44px !important;
        height: 44px !important;
        max-width: 44px !important;
        max-height: 44px !important;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid var(--accent);
        box-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
        background-color: #000;
        flex-shrink: 0;
        display: block;
    }

    header h1 {
        font-size: 1.25rem;
        background: linear-gradient(45deg, var(--accent), #00b347);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 800;
    }

    .brand-sub {
        font-size: 0.75rem;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .bar-chain {
        background: rgba(0, 255, 102, 0.1);
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .bar-chain::before {
        content: "";
        width: 8px;
        height: 8px;
        background-color: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent);
    }

    #state { 
        color: var(--accent-bright); 
        font-size: 1.3rem; 
        font-weight: 800; 
        margin: 20px 0 12px; 
        text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }

    .ok { color: var(--accent); }
    .bad { color: var(--red); }
    .warn { color: var(--amber); }

    /* CONSOLE DE LOGS */
    #out {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 16px;
        color: var(--text-main);
        font-family: Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 1.5;
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        white-space: pre-wrap;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 20px rgba(0, 255, 102, 0.1);
    }

    @media (max-width: 760px) {
        header { padding: 12px 16px; }
        .app { padding: 16px 12px; }
        #state { font-size: 1.1rem; }
    }
</style>
</head>
<body>
    <div class="app">
        <!-- HEADER GLOBAL EDUGPS4 -->
        <header>
            <div class="brand-header">
                <img src="./Gps4.png" alt="Logo EduGps4" class="gps4-logo">
                <div>
                    <h1>EduGps4</h1>
                    <div class="brand-sub">Eduxds2 · Firmware 13.02-13.52</div>
                </div>
            </div>
            <span class="bar-chain">CADEIA DO EXPLOIT</span>
        </header>

        <div id="state">Iniciando desbloqueio...</div>
        <div id="out"></div>
    </div>

<script type="module">import "./jb.js";</script>
<script>
(function () {
    var KEY = "edugps4-1352-reloads";
    var MAX = 2;
    var WINDOW_MS = 10 * 60 * 1000;
    var handled = false;
    function readBudget() {
        var rec = null;
        try { rec = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) { rec = null; }
        var now = Date.now();
        if (!rec || typeof rec.n !== "number" || (now - rec.t) > WINDOW_MS) return { n: 0, t: now };
        return rec;
    }
    function spendBudget() {
        var rec = readBudget();
        rec.n++;
        rec.t = Date.now();
        try {
            sessionStorage.setItem(KEY, JSON.stringify(rec));
            var check = JSON.parse(sessionStorage.getItem(KEY) || "null");
            if (check && check.n === rec.n) return rec;
        } catch (e) {}
        return null;
    }
    function successSeen(txt) {
        var lines = txt.split("\n");
        for (var i = lines.length - 1; i >= 0; i--) {
            if (lines[i].indexOf("PAYLOAD-RUNNING") !== -1) {
                return lines[i].indexOf("PROOF-OK") === 0;
            }
        }
        return false;
    }
    setInterval(function () {
        try {
            if (handled) return;
            var st = document.getElementById("state");
            var out = document.getElementById("out");
            var txt = out ? out.textContent : "";
            
            // Traduz a mensagem dinamica "no offsets for this firmware" se ela aparecer
            if (st && st.textContent === "no offsets for this firmware") {
                st.textContent = "Sem offsets para este firmware";
            }

            if (successSeen(txt)) {
                try { sessionStorage.removeItem(KEY); } catch (e) {}
                handled = true;
                return;
            }
            if (!st || st.textContent !== "threw") return;
            if (txt.indexOf("attempt-ceiling") === -1) return;
            handled = true;
            var rec = spendBudget();
            if (!rec || rec.n > MAX) return;
            st.textContent = "Falha na organização da memória -- recarregando para nova tentativa (" + rec.n + "/2)...";
            st.className = "warn";
            setTimeout(function () { location.reload(); }, 2000);
        } catch (e) { }
    }, 500);
})();
</script>
</body>

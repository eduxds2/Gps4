<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.manifest">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGps4 // PS4 Host & Cache</title>
    <link rel="icon" type="image/png" href="Gps4.png">
    <style>
        :root {
            --bg: #151515;
            --panel: #1c1c1c;
            --panel-2: #242424;
            --line: #2e2e2e;
            --line-bright: #454545;
            --text: #f5f5f5;
            --muted: #b5b5b5;
            --dim: #828282;
            --accent: #a294ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg); }
        html, body { min-height: 100%; }
        body {
            background-color: var(--bg);
            background-image: linear-gradient(rgba(162, 148, 255, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(162, 148, 255, .05) 1px, transparent 1px);
            background-size: 36px 36px;
            color: var(--text);
            display: flex;
            flex-direction: column;
            font: 17px/1.4 Consolas, "Liberation Mono", monospace;
            min-height: 100vh;
            overflow: hidden;
        }
        a { color: inherit; }

        .app { display: flex; flex: 1 0 auto; flex-direction: column; margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 920px); }

        .bar {
            align-items: center;
            border: 1px solid var(--line-bright);
            display: flex;
            font-size: 14px;
            justify-content: space-between;
            letter-spacing: .1em;
            padding: 10px 16px;
            text-transform: uppercase;
        }
        .bar b { color: var(--accent); font-weight: 400; }
        .bar-fw { color: var(--dim); }
        .bar-fw::before { color: var(--accent); content: "\25CF "; }

        .layout { display: flex; flex: 1 0 auto; flex-direction: column; justify-content: center; padding: 20px 0 0; }

        .kicker { color: var(--accent); font-size: 14px; letter-spacing: .14em; margin: 0 0 12px; }
        h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 400; letter-spacing: -.07em; line-height: 1; margin: 0; }
        h1 em { color: var(--accent); font-style: normal; }

        .boot { color: var(--dim); font-size: 14px; list-style: none; margin: 12px 0 0; }
        .boot li { margin: 3px 0; }
        .boot b { color: var(--accent); font-weight: 400; }

        .progress-container { margin-top: 20px; width: 100%; }
        .progress-label { color: var(--accent); font-size: 15px; margin-bottom: 10px; }
        .progress-wrapper { background: var(--panel); border: 1px solid var(--line-bright); padding: 6px; }
        .progress-bar { background: var(--panel-2); border: 1px solid var(--line); height: 62px; overflow: hidden; position: relative; }
        .progress-fill { background: var(--accent); height: 100%; width: 0; }
        .progress-text { color: var(--text); font-size: 20px; font-weight: 400; left: 50%; position: absolute; text-shadow: 0 1px 8px rgba(0, 0, 0, .8); top: 50%; transform: translate(-50%, -50%); z-index: 3; }

        .foot {
            border-top: 1px solid var(--line);
            color: var(--dim);
            font-size: 13px;
            margin-top: 16px;
            padding: 12px 4px 2px;
            text-align: center;
        }

        @media (max-width: 700px) {
            body { overflow: auto; }
            .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
            .bar { font-size: 12px; padding: 8px 12px; }
            .layout { padding-top: 14px; }
            h1 { font-size: 40px; }
            .progress-bar { height: 56px; }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="bar">
            <span><b>EDUGPS4</b> // PS4 HOST</span>
            <span class="bar-fw">INSTALAÇÃO CACHE</span>
        </header>

        <main class="layout">
            <p class="kicker">$ ./edugps4 --cache</p>
            <h1>Carregando <em>Cache Offline</em></h1>
            <ul class="boot">
                <li>[ <b>ok</b> ] Arquivos do exploit prontos</li>
                <li>[ <b>..</b> ] Baixando arquivos para a memória local</li>
            </ul>

            <section class="progress-container">
                <div class="progress-label" id="progress">Aguarde...</div>
                <div class="progress-wrapper">
                    <div class="progress-bar" id="myProgress">
                        <div class="progress-fill" id="myBar"></div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="foot">
            EduGps4 &copy; Host Personalizado PS4
        </footer>
    </div>

    <script>
        if (window.applicationCache.status == 2) { localStorage.isCached = true; }
        window.applicationCache.ondownloading = function () {
            document.getElementById("progress").innerHTML = "Instalação do Cache Iniciada!";
            localStorage.isCached = false;
        };
        window.applicationCache.onprogress = function (a) {
            var progress = Math.round(100 * (a.loaded / a.total));
            document.getElementById("myBar").style.width = progress + "%";
            document.getElementById("progressText").innerHTML = progress + "%";
        };
        window.applicationCache.oncached = function () {
            document.getElementById("progress").innerHTML = "Cache Instalado com Sucesso!";
            localStorage.isCached = true;
            setTimeout(function () { window.location.replace("index.html"); }, 1500);
        };
        window.applicationCache.onupdateready = function () {
            document.getElementById("progress").innerHTML = "Cache Atualizado com Sucesso!";
            localStorage.isCached = true;
            setTimeout(function () { window.location.replace("index.html"); }, 1500);
        };
        window.applicationCache.onnoupdate = function () { window.location.replace("index.html"); };
        window.applicationCache.onerror = function () { window.location.replace("index.html"); };
    </script>
</body>

</html>

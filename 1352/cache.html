<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGps4 // PS4 13.02-13.52 HOST / Eduxds2 </title>
    <link rel="icon" type="image/png" href="../../pspulse.png">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #131c2e;
            --card-hover: #1c2a45;
            --accent: #00d2ff;
            --accent-purple: #9d4edd;
            --accent-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --success: #00e676;
            --border: #2d3748;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; }
        html { background: var(--bg-dark); }
        html, body { min-height: 100%; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }
        a { color: inherit; text-decoration: none; }

        /* HEADER */
        header {
            background: #0b111e;
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-header { display: flex; align-items: center; }
        .gengar-logo {
            width: 44px;
            height: 44px;
            margin-right: 12px;
            filter: drop-shadow(0 0 10px rgba(157, 78, 221, 0.7));
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1.2rem;
            color: var(--accent);
            background: linear-gradient(45deg, var(--accent), var(--accent-pink));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }
        .brand-sub { font-size: 0.75rem; color: var(--accent); font-weight: 700; }
        .pill {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
        }
        .pill::before { color: var(--success); content: "\25CF "; }

        /* PAGE */
        .app { display: flex; flex: 1 0 auto; flex-direction: column; margin: 0 auto; max-width: 920px; padding: 40px; width: 100%; }
        .layout { display: flex; flex: 1 0 auto; flex-direction: column; justify-content: center; }

        .header-box h2 { font-size: 1.8rem; font-weight: 800; line-height: 1.2; margin-bottom: 6px; }
        .header-box h2 span { color: var(--accent); }

        .chips { margin: 16px 0 6px; }
        .chip {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            margin: 0 8px 8px 0;
            padding: 6px 14px;
        }
        .chip b { color: var(--success); font-weight: 700; }

        /* PROGRESS CARD */
        .progress-container {
            background: linear-gradient(145deg, var(--card-bg), #0f172a);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            margin-top: 20px;
            overflow: hidden;
            padding: 26px 28px;
            position: relative;
            width: 100%;
        }
        .progress-container::before {
            background: linear-gradient(180deg, var(--accent), var(--accent-purple));
            content: '';
            height: 100%;
            left: 0;
            position: absolute;
            top: 0;
            width: 4px;
        }
        .progress-label { color: var(--accent); font-size: 1.1rem; font-weight: 800; margin-bottom: 14px; }
        .progress-wrapper { background: #090d16; border: 1px solid var(--border); border-radius: 12px; padding: 6px; }
        .progress-bar { background: #0f172a; border-radius: 8px; height: 56px; overflow: hidden; position: relative; }
        .progress-fill { background: linear-gradient(90deg, var(--accent), var(--accent-purple)); height: 100%; width: 0; }
        .progress-text { color: var(--text-main); font-size: 1.3rem; font-weight: 800; left: 50%; position: absolute; text-shadow: 0 1px 8px rgba(0, 0, 0, .8); top: 50%; transform: translate(-50%, -50%); z-index: 3; }
        .status-message { color: var(--text-muted); font-size: 0.9rem; margin-top: 14px; }

        /* FOOTER */
        .foot {
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 28px;
            padding: 16px 4px 4px;
            text-align: center;
        }
        .foot a { color: var(--accent); font-weight: 700; }
        .foot a:hover, .foot a:focus { color: var(--accent-pink); }

        @media (max-width: 700px) {
            body { overflow: auto; }
            header { padding: 12px 14px; }
            .app { padding: 20px 14px; }
            .header-box h2 { font-size: 1.4rem; }
            .progress-container { padding: 20px 18px; }
            .progress-bar { height: 50px; }
        }
    </style>
</head>

<body>
    <header>
        <div class="brand-header">
            <svg class="gengar-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="ghostBody" cx="38%" cy="32%" r="75%">
                        <stop offset="0%" stop-color="#b06fe0"/>
                        <stop offset="55%" stop-color="#8b3fd1"/>
                        <stop offset="100%" stop-color="#5a189a"/>
                    </radialGradient>
                    <linearGradient id="ghostSpike" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#7b2cbf"/>
                        <stop offset="100%" stop-color="#4c1580"/>
                    </linearGradient>
                </defs>
                <path d="M22 30 L14 12 L30 22 Z" fill="url(#ghostSpike)"/>
                <path d="M78 30 L86 12 L70 22 Z" fill="url(#ghostSpike)"/>
                <path d="M50 12 C 72 12, 86 28, 86 50 C 86 62, 82 68, 86 74 C 82 76, 78 73, 75 76 C 71 79, 71 74, 66 78 C 62 81, 62 76, 57 80 C 53 83, 47 83, 43 80 C 38 76, 38 81, 34 78 C 29 74, 29 79, 25 76 C 22 73, 18 76, 14 74 C 18 68, 14 62, 14 50 C 14 28, 28 12, 50 12 Z" fill="url(#ghostBody)" stroke="#3c096c" stroke-width="1.5"/>
                <path d="M27 42 Q 37 34, 46 44 Q 38 50, 27 42 Z" fill="#fefefe"/>
                <circle cx="38" cy="43" r="3.4" fill="#0d0221"/>
                <path d="M73 42 Q 63 34, 54 44 Q 62 50, 73 42 Z" fill="#fefefe"/>
                <circle cx="62" cy="43" r="3.4" fill="#0d0221"/>
                <path d="M30 58 Q 50 76, 70 58 Q 66 68, 50 70 Q 34 68, 30 58 Z" fill="#1a0b2e"/>
                <path d="M33 59 Q 50 71, 67 59" stroke="#ff2fb0" stroke-width="1.5" fill="none" opacity="0.7"/>
            </svg>
            <div>
                <h1>&#9889; EduGps4</h1>
                <div class="brand-sub">PS4 Hosts &middot; GoldHEN</div>
            </div>
        </div>
        <span class="pill">cache update</span>
    </header>

    <div class="app">
        <main class="layout">
            <div class="header-box">
                <h2>Loading <span>offline cache</span></h2>
            </div>

            <div class="chips">
                <span class="chip"><b>ok</b> slopkit chain ready</span>
                <span class="chip"><b>..</b> downloading host files</span>
            </div>

            <section class="progress-container">
                <div class="progress-label" id="progress">Loading.. Please Wait !!!</div>
                <div class="progress-wrapper">
                    <div class="progress-bar" id="myProgress">
                        <div class="progress-fill" id="myBar"></div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
                <div class="status-message">Initializing cache system...</div>
            </section>
        </main>

        <footer class="foot">
            Author:<a href=".">.</a> // Telegram: <a href=".">PlayStation 4</a>
        </footer>
    </div>

    <script>
if (window.applicationCache.status == 2) { localStorage.is1352Cached = true; }
        window.applicationCache.ondownloading = function () {
            document.getElementById("progress").innerHTML = "Page Caching Started!!";
            localStorage.is1352Cached = false;
        };
        window.applicationCache.onprogress = function (a) {
            var progress = Math.round(100 * (a.loaded / a.total));
            document.getElementById("myBar").style.width = progress + "%";
            document.getElementById("progressText").innerHTML = progress + "%";
        };
        window.applicationCache.oncached = function () {
            document.getElementById("progress").innerHTML = "Page Cached Successfully!!!";
            localStorage.is1352Cached = true;
            setTimeout(function () { window.location.replace("index.html"); }, 1500);
        };
        window.applicationCache.onupdateready = function () {
            document.getElementById("progress").innerHTML = "Update Cache Successfully!!!";
            localStorage.is1352Cached = true;
            setTimeout(function () { window.location.replace("index.html"); }, 1500);
        };
        window.applicationCache.onnoupdate = function () { window.location.replace("index.html"); };
        window.applicationCache.onerror = function () { window.location.replace("index.html"); };
    </script>
</body>

</html>

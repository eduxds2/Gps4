<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.manifest">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGps4 // HOST PS4 13.02-13.52 / Eduxds2</title>
    <link rel="icon" type="image/png" href="Gps4.png">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #131c2e;
            --card-hover: #1c2a45;
            --accent: #00d2ff;
            --accent-purple: #9d4edd;
            --accent-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --success: #00e676;
            --border: #2d3748;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; }
        html { background: var(--bg-dark); }
        html, body { min-height: 100%; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }
        a { color: inherit; text-decoration: none; }

        /* HEADER */
        header {
            background: #0b111e;
            border-bottom: 1px solid var(--border);
            padding: 16px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-header { display: flex; align-items: center; }
        .gps4-logo {
            width: 44px;
            height: 44px;
            margin-right: 12px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.7));
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1.2rem;
            color: var(--accent);
            background: linear-gradient(45deg, var(--accent), var(--accent-pink));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }
        .brand-sub { font-size: 0.75rem; color: var(--accent); font-weight: 700; }
        .pill {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
        }
        .pill::before { color: var(--success); content: "\25CF "; }

        /* PAGE */
        .app { display: flex; flex: 1 0 auto; flex-direction: column; margin: 0 auto; max-width: 920px; padding: 40px; width: 100%; }
        .layout { display: flex; flex: 1 0 auto; flex-direction: column; justify-content: center; }

        .header-box h2 { font-size: 1.8rem; font-weight: 800; line-height: 1.2; margin-bottom: 6px; }
        .header-box h2 span { color: var(--accent); }

        .chips { margin: 16px 0 6px; }
        .chip {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            margin: 0 8px 8px 0;
            padding: 6px 14px;
        }
        .chip b { color: var(--success); font-weight: 700; }

        /* PROGRESS CARD */
        .progress-container {
            background: linear-gradient(145deg, var(--card-bg), #0f172a);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            margin-top: 20px;
            overflow: hidden;
            padding: 26px 28px;
            position: relative;
            width: 100%;
        }
        .progress-container::before {
            background: linear-gradient(180deg, var(--accent), var(--accent-purple));
            content: '';
            height: 100%;
            left: 0;
            position: absolute;
            top: 0;
            width: 4px;
        }
        .progress-label { color: var(--accent); font-size: 1.1rem; font-weight: 800; margin-bottom: 14px; }
        .progress-wrapper { background: #090d16; border: 1px solid var(--border); border-radius: 12px; padding: 6px; }
        .progress-bar { background: #0f172a; border-radius: 8px; height: 56px; overflow: hidden; position: relative; }
        .progress-fill { background: linear-gradient(90deg, var(--accent), var(--accent-purple)); height: 100%; width: 0; }
        .progress-text { color: var(--text-main); font-size: 1.3rem; font-weight: 800; left: 50%; position: absolute; text-shadow: 0 1px 8px rgba(0, 0, 0, .8); top: 50%; transform: translate(-50%, -50%); z-index: 3; }
        .status-message { color: var(--text-muted); font-size: 0.9rem; margin-top: 14px; }

        /* FOOTER */
        .foot {
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 28px;
            padding: 16px 4px 4px;
            text-align: center;
        }
        .foot a { color: var(--accent); font-weight: 700; }
        .foot a:hover, .foot a:focus { color: var(--accent-pink); }

        @media (max-width: 700px) {
            body { overflow: auto; }
            header { padding: 12px 14px; }
            .app { padding: 20px 14px; }
            .header-box h2 { font-size: 1.4rem; }
            .progress-container { padding: 20px 18px; }
            .progress-bar { height: 50px; }
        }
    </style>
</head>

<body>
    <header>
        <div class="brand-header">
            <img src="Gps4.png" alt="Logo EduGps4" class="gps4-logo">
            <div>
                <h1>⚡ EduGps4</h1>
                <div class="brand-sub">Hosts PS4 &middot; GoldHEN</div>
            </div>
        </div>
        <span class="pill">atualização de cache</span>
    </header>

    <div class="app">
        <main class="layout">
            <div class="header-box">
                <h2>Carregando <span>cache offline</span></h2>
            </div>

            <div class="chips">
                <span class="chip"><b>ok</b> cadeia slopkit pronta</span>
                <span class="chip"><b>..</b> baixando arquivos do host</span>
            </div>

            <section class="progress-container">
                <div class="progress-label" id="progress">Carregando... Por favor, aguarde!</div>
                <div class="progress-wrapper">
                    <div class="progress-bar" id="myProgress">
                        <div class="progress-fill" id="myBar"></div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
                <div class="status-message" id="statusMsg">Inicializando sistema de cache...</div>
            </section>
        </main>

        <footer class="foot">
            Autor: <a href=".">.</a> // Telegram: <a href=".">PlayStation 4</a>
        </footer>
    </div>

    <script>
        if (window.applicationCache.status == 2) { localStorage.is1352Cached = true; }
        window.applicationCache.ondownloading = function () {
            document.getElementById("progress").innerHTML = "Salvamento de Página Iniciado!";
            document.getElementById("statusMsg").innerHTML = "Baixando arquivos para uso offline...";
            localStorage.is1352Cached = false;
        };
        window.applicationCache.onprogress = function (a) {
            var progress = Math.round(100 * (a.loaded / a.total));
            document.getElementById("myBar").style.width = progress + "%";
            document.getElementById("progressText").innerHTML = progress + "%";
        };
        window.applicationCache.oncached = function () {
            document.getElementById("progress").innerHTML = "Página Salva com Sucesso!";
            document.getElementById("statusMsg").innerHTML = "O host foi armazenado na memória. Redirecionando...";
            localStorage.is1352Cached = true;
            setTimeout(function () { window.location.replace("index.html"); }, 1500);
        };
        window.applicationCache.onupdateready = function () {
            document.getElementById("progress").innerHTML = "Cache Atualizado com Sucesso!";
            document.getElementById("statusMsg").innerHTML = "Os novos arquivos foram salvos. Redirecionando...";
            localStorage.is1352Cached = true;
            setTimeout(function () { window.location.replace("index.html"); }, 1500);
        };
        window.applicationCache.onnoupdate = function () { window.location.replace("index.html"); };
        window.applicationCache.onerror = function () { window.location.replace("index.html"); };
    </script>
</body>

</html>

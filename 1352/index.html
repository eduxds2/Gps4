<!DOCTYPE html>
<html lang="pt-BR" manifest="cache.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EduGps4 </title>
<link rel="icon" type="image/png" href="./Gps4.png">
<style>
    :root {
        --bg-dark: #050b05;
        --card-bg: #0c180c;
        --card-hover: #142814;
        --accent: #00ff66;         /* Verde neon principal */
        --accent-dim: #00b347;     /* Verde secundario */
        --accent-bright: #00ff88;  /* Verde de destaque */
        --text-main: #e6ffe6;
        --text-muted: #80c080;
        --border: #1a3d1a;
        --red: #ff4d4d;
        --amber: #ffcc00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    html, body { min-height: 100%; height: 100%; }

    body {
        background-color: var(--bg-dark);
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.12) 0%, transparent 60%),
            radial-gradient(circle at 15% 20%, rgba(0, 255, 102, 0.08) 0%, transparent 45%),
            radial-gradient(circle at 85% 80%, rgba(0, 179, 71, 0.08) 0%, transparent 45%);
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
    }

    .app { 
        display: flex; 
        flex-direction: column; 
        width: 100%; 
        max-width: 1220px; 
        height: 100vh; 
        padding: 24px; 
    }

    /* HEADER GLOBAL SUPERIOR */
    header {
        background: #081208;
        border-bottom: 1px solid var(--border);
        padding: 16px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        border-radius: 12px;
        width: 100%;
    }

    .brand-header {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    /* LOGO Gps4.png - TAMANHO CONTROLADO COM TRAVA DE SEGURANÇA */
    .gps4-logo {
        width: 44px !important;
        height: 44px !important;
        max-width: 44px !important;
        max-height: 44px !important;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid var(--accent);
        box-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
        background-color: #000;
        flex-shrink: 0;
        display: block;
    }

    header h1 {
        font-size: 1.25rem;
        background: linear-gradient(45deg, var(--accent), #00b347);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 800;
    }

    .brand-sub {
        font-size: 0.75rem;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .bar-ready {
        background: rgba(0, 255, 102, 0.1);
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .bar-ready::before {
        content: "";
        width: 8px;
        height: 8px;
        background-color: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent);
    }

    /* CONTAINER CENTRALIZADO */
    .main-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        width: 100%;
    }

    .hero-title { 
        font-size: clamp(32px, 5vw, 48px); 
        font-weight: 800; 
        letter-spacing: -.03em; 
        line-height: 1.1; 
        margin-bottom: 8px; 
        color: #fff; 
    }

    .hero-title em { 
        color: var(--accent); 
        font-style: normal; 
        text-shadow: 0 0 15px rgba(0, 255, 102, 0.5); 
    }

    .sub { 
        color: var(--text-muted); 
        font-size: 1.1rem; 
        margin-bottom: 24px; 
    }

    /* CARD DE STATUS DO HOST */
    .status-card {
        background: var(--card-bg);
        border: 2px solid var(--accent);
        border-radius: 20px;
        padding: 30px 40px;
        width: min(100%, 540px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        box-shadow: 0 0 30px rgba(0, 255, 102, 0.25);
    }

    #state { 
        font-size: 1.4rem; 
        font-weight: 800; 
        color: var(--accent-bright); 
        text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }
    #det { color: var(--text-muted); font-size: 0.95rem; font-weight: 600; }
    #det b { color: #fff; }
    #cache { color: var(--text-muted); font-size: 0.85rem; min-height: 18px; }
    #cache.cacheok { color: var(--accent); font-weight: 700; }

    .ok { color: var(--accent); }
    .bad { color: var(--red); }
    .warn { color: var(--amber); }

    /* RODAPÉ EDUGPS4 */
    .foot {
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 13px;
        padding: 16px 4px 4px;
        text-align: center;
        width: 100%;
    }
    .foot b { color: var(--accent); }

    @media (max-width: 760px) {
        header { padding: 12px 16px; }
        .app { padding: 16px 12px; }
        .status-card { padding: 24px 20px; }
        .hero-title { font-size: 32px; }
    }
</style>
</head>
<body>
    <div class="app">
        <!-- HEADER GLOBAL EDUGPS4 -->
        <header>
            <div class="brand-header">
                <img src="./Gps4.png" alt="Logo EduGps4" class="gps4-logo">
                <div>
                    <h1>EduGps4</h1>
                    <div class="brand-sub">Eduxds2 · Firmware 13.02-13.52</div>
                </div>
            </div>
            <span class="bar-ready">SISTEMA PRONTO</span>
        </header>

        <!-- CONTEÚDO CENTRALIZADO -->
        <main class="main-container">
            <h2 class="hero-title">Verificar <em>Firmware</em></h2>
            <p class="sub">Detectando versão e preparando GoldHEN</p>

            <section class="status-card">
                <div id="state">Detectando firmware...</div>
                <div id="det"></div>
                <div id="cache"></div>
            </section>
        </main>

        <!-- RODAPÉ EDUGPS4 -->
        <footer class="foot">
            <div><b>EduGps4</b> // Sistema de Desbloqueio PS4 · <b>Eduxds2</b></div>
        </footer>
    </div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }

    function queryValue(name) {
        var match = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
        return match ? decodeURIComponent(match[1]) : null;
    }

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = queryValue("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    detEl.innerHTML = "Firmware <b>" + (key || "desconhecido") + "</b>"
        + " &middot; <b>" + (supported ? "Suportado" : "Não suportado") + "</b>";

    var target = "jb.html" + location.search;
    if (location.search.indexOf("log=") === -1) {
        target += (location.search ? "&" : "?") + "log=1";
    }
    function go() {
        setState("Iniciando jailbreak...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("FIRMWARE NÃO SUPORTADO", "bad");
        waitForTap("NÃO SUPORTADO (" + (key || "desconhecido") + ") -- Pressione X ou clique para executar assim mesmo", go);
        return;
    }

    function waitForDownload() {
        setCache("Verificando cache...");
        ac.addEventListener("downloading",
            function () { setCache("Salvando para uso offline..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("Salvando " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("Salvo com sucesso para uso offline", true);
            waitForTap("INSTALADO -- Pressione X ou clique para iniciar", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("Atualização baixada", true);
            waitForTap("ATUALIZAÇÃO PRONTA -- Pressione X para recarregar",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("Cache pronto -- Modo Offline", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("Cache indisponível");
            waitForTap("FALHA NO CACHE -- Pressione X para executar assim mesmo", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("Cache obsoleto");
            waitForTap("CACHE OBSOLETO -- Pressione X para continuar", go);
        }, false);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("Modo Offline -- Usando Cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("Cache detectado -- Verificando atualizações...");
        setTimeout(function () {
            if (ac.status === ac.CHECKING || ac.status === ac.DOWNLOADING) {
                setCache("Nova atualização encontrada -- Baixando...");
                waitForDownload();
            } else if (ac.status === ac.UPDATEREADY) {
                try { ac.swapCache(); } catch (e) {}
                setCache("Atualização baixada", true);
                waitForTap("ATUALIZAÇÃO PRONTA -- Pressione X para recarregar",
                           function () { location.reload(); });
            } else {
                setCache("Cache pronto", true);
                go();
            }
        }, 3000);
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("Atualização baixada", true);
        waitForTap("ATUALIZAÇÃO PRONTA -- Pressione X para recarregar",
                   function () { location.reload(); });
    } else {
        waitForDownload();
    }
})();
</script>
</body>
</html>
